<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>FPP Project — Builder / Runner Viewer</title>
<style>
  :root {
    --bg: #fafafa; --paper: #fff; --line: #e5e5e5; --line-strong: #c8c8c8;
    --ink: #111; --muted: #666; --accent: #1f6feb;
    --builder: #c75450; --runner: #4a78c8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Noto Sans CJK KR", "Malgun Gothic", "맑은 고딕", sans-serif;
         color: var(--ink); background: var(--bg); }

  header.topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center;
                  justify-content: space-between; padding: 10px 18px; background: var(--paper);
                  border-bottom: 1px solid var(--line); }
  header.topbar h1 { margin: 0; font-size: 15px; font-weight: 600; }
  header.topbar .actions button { background: #fff; border: 1px solid var(--line-strong);
                                   padding: 6px 10px; font-size: 12px; cursor: pointer;
                                   border-radius: 4px; margin-left: 6px; }
  header.topbar .actions button:hover { background: #f0f0f0; }

  .tabs { display: flex; gap: 0; padding: 0 18px; background: var(--paper);
          border-bottom: 1px solid var(--line); }
  .tab-btn { background: none; border: 0; border-bottom: 2px solid transparent;
             padding: 12px 18px; font-size: 13px; font-weight: 600; cursor: pointer;
             color: var(--muted); font-family: inherit; }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active.builder { color: var(--builder); border-bottom-color: var(--builder); }
  .tab-btn.active.runner  { color: var(--runner);  border-bottom-color: var(--runner); }
  .tab-btn .badge { display: inline-block; background: #f0a020; color: #fff;
                    border-radius: 9px; padding: 1px 7px; font-size: 10px; margin-left: 6px; }

  main { display: grid; grid-template-columns: 1fr 380px; min-height: calc(100vh - 90px);
         transition: grid-template-columns 0.2s ease; }
  main.panel-collapsed { grid-template-columns: 1fr 0; }
  .canvas-wrap { padding: 16px; overflow: auto; }
  .diagram-canvas svg { max-width: 100%; height: auto; background: var(--paper);
                         border: 1px solid var(--line); border-radius: 6px; }
  .diagram-canvas[hidden] { display: none; }

  aside.panel { background: var(--paper); border-left: 1px solid var(--line);
                display: flex; flex-direction: column;
                overflow: hidden; transition: width 0.2s ease; }
  main.panel-collapsed aside.panel { display: none; }

  .reopen-handle { position: fixed; top: 130px; right: 0; z-index: 9;
                   background: var(--paper); border: 1px solid var(--line-strong);
                   border-right: 0; border-radius: 6px 0 0 6px;
                   padding: 10px 8px; font-size: 13px; cursor: pointer;
                   color: #333; box-shadow: -1px 1px 4px rgba(0,0,0,0.04);
                   display: none; }
  main.panel-collapsed ~ .reopen-handle { display: block; }
  .reopen-handle:hover { background: #f0f0f0; }

  aside.panel .panel-header { padding: 14px 16px; border-bottom: 1px solid var(--line);
                              display: flex; align-items: flex-start;
                              justify-content: space-between; gap: 8px; }
  aside.panel .panel-header .name { font-size: 14px; font-weight: 600; line-height: 1.4; }
  aside.panel .panel-header .id { color: var(--muted); font-size: 11px;
                                   font-family: ui-monospace, monospace; margin-top: 2px; }
  aside.panel .panel-header .diagram-tag { font-size: 10px; padding: 2px 6px;
                                            border-radius: 3px; margin-left: 6px;
                                            color: #fff; font-weight: 600; }
  aside.panel .panel-header .diagram-tag.builder { background: var(--builder); }
  aside.panel .panel-header .diagram-tag.runner  { background: var(--runner); }
  aside.panel .panel-header .close { background: none; border: 0; font-size: 18px;
                                      cursor: pointer; color: var(--muted); padding: 0 2px; }
  aside.panel .panel-body { padding: 12px 16px; overflow: auto; flex: 1; }
  aside.panel .section { margin-bottom: 14px; }
  aside.panel .section label { display: flex; justify-content: space-between;
                                align-items: baseline; font-size: 12px;
                                font-weight: 600; color: #333; margin-bottom: 4px; }
  aside.panel .section label .count { font-weight: 400; color: var(--muted); font-size: 11px; }
  aside.panel textarea { width: 100%; min-height: 110px; padding: 8px;
                         border: 1px solid var(--line-strong); border-radius: 4px;
                         font-family: inherit; font-size: 13px; resize: vertical; line-height: 1.5; }
  aside.panel .panel-body { display: flex; flex-direction: column; }
  aside.panel .section.memo-only { flex: 1; display: flex; flex-direction: column; }
  aside.panel .section.memo-only textarea { flex: 1; min-height: 240px; resize: none; }
  aside.panel .memo-links { margin-top: 8px; padding: 6px 8px; border: 1px dashed var(--line);
                            border-radius: 4px; font-size: 12px; max-height: 100px; overflow: auto; }
  aside.panel .memo-links.empty { display: none; }
  aside.panel .memo-links .label { color: var(--muted); font-size: 11px;
                                    font-weight: 600; margin-bottom: 4px; }
  aside.panel .memo-links a { display: block; color: var(--accent); text-decoration: none;
                               word-break: break-all; padding: 1px 0; }
  aside.panel .memo-links a:hover { text-decoration: underline; }
  aside.panel textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px;
                                 border-color: var(--accent); }
  aside.panel .save-state { font-size: 11px; color: var(--muted); padding: 0 16px 12px; }
  aside.panel .empty { padding: 40px 18px; color: var(--muted); text-align: center; font-size: 13px; }

  aside.panel .all-notes { border-top: 1px solid var(--line); padding: 10px 16px;
                            max-height: 240px; overflow: auto; }
  aside.panel .all-notes h3 { font-size: 12px; font-weight: 600; margin: 4px 0 8px; color: #333; }
  aside.panel .all-notes h3 .filter { font-weight: 400; color: var(--muted); }
  aside.panel .all-notes ul { list-style: none; padding: 0; margin: 0; }
  aside.panel .all-notes li { padding: 5px 6px; font-size: 12px; cursor: pointer;
                                border-radius: 3px; display: flex; justify-content: space-between;
                                gap: 6px; align-items: center; }
  aside.panel .all-notes li:hover { background: #f3f3f3; }
  aside.panel .all-notes li .tag { color: var(--muted); font-size: 10px; }
  aside.panel .all-notes li .diag {
    font-size: 9px; padding: 1px 5px; border-radius: 3px;
    color: #fff; font-weight: 600; margin-right: 4px;
  }
  aside.panel .all-notes li .diag.builder { background: var(--builder); }
  aside.panel .all-notes li .diag.runner  { background: var(--runner); }

  /* SVG hit overlay */
  .node-hit { fill: transparent; stroke: transparent; cursor: pointer;
              pointer-events: all; transition: fill 0.12s, stroke 0.12s;  }
  .node-hit:hover { fill: rgba(31,111,235,0.06); stroke: rgba(31,111,235,0.5);
                     stroke-width: 1.2; stroke-dasharray: 3 2; }
  .node-hit.selected { fill: rgba(31,111,235,0.10); stroke: rgba(31,111,235,0.9);
                        stroke-width: 1.8; stroke-dasharray: none; }
  .node-hit.has-notes { fill: rgba(255,180,40,0.06); stroke: rgba(220,150,30,0.7);
                         stroke-width: 1.2; stroke-dasharray: 4 2; }
  .node-hit.has-notes.selected { fill: rgba(31,111,235,0.10); stroke: rgba(31,111,235,0.9);
                                  stroke-width: 1.8; stroke-dasharray: none; }
  .note-dot { fill: #f0a020; stroke: #fff; stroke-width: 1; pointer-events: none; }

  footer.legend { display: flex; gap: 18px; padding: 10px 18px; background: var(--paper);
                  border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  footer.legend .item { display: flex; align-items: center; gap: 6px; }
  footer.legend .swatch { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
  footer.legend .sw-noted    { background: rgba(255,180,40,0.18); border: 1.5px dashed rgba(220,150,30,0.7); }
  footer.legend .sw-selected { background: rgba(31,111,235,0.18); border: 1.5px solid rgba(31,111,235,0.9); }
  footer.legend .sw-hover    { background: rgba(31,111,235,0.08); border: 1.5px dashed rgba(31,111,235,0.5); }
</style>
</head>

    "memo": "Opendata loader / pymupdf 비교 분석 필요.\n\n이슈 : Opendataloader가 layout를 반영하여 json/md/html로 대체로 잘 주긴함. \n하지만 두 문제가 현재 발견되어 파악 중\n1. 가끔 두 셀 내용을 합쳐서 처리함\n2. 세로로 긴 cell의 세로 배치 글자를 거꾸로 읽어서 그대로 출력 \n",
    "updatedAt": "2026-05-14T07:56:25.496Z"
  },
  "builder/reader-ocr": {
    "memo": "7주간의 과업 : \n- OCR 실험 정리\nhttps://www.notion.so/OCR-KIE-3457d269eb39800b82a5fc0fc614410c\n\n해당 과업 중, key find / key solution\n1. EasyOCR의 detection 모델에서(craft_mlt_25k) 문제발생\n- 세로 글자를 인식하지 못하고, 가로로 읽어서 결과를 냄\n- 한 글자를 길쭉하게 bbox 침\n- 다른 영역에 가로로 침범함\n-> CRAFT 논문을 찾아보고, 구조를 분석하여 수평 Affinity에 강하게 편향된 것을 확인하였음.\n이렇게 설계된 모델 자체를 바꿀 수 없으니, 문제점 파악 후, 바로 다른 모델 테스트로 넘어감.\n\n2. PPSturctureV3를 찾아, 해당 파이프라인의 작동방식 및 세부 모델을 살펴보고 한국어 비즈니스 문서에 적용해봄. \nPPsturctureV3가 잘 작동하지 않는 문서였기에, det 모델과 rec 모델만 가지고 나옴\n\n3. PPsturctureV3나 pdf reader tool이 제공하는 레이아웃 정보 제공말고도, 어떻게 layout 정보를 효과적으로 추출하여 반영할 수 있을 지 생각하고 찾아보기 시작함. \n-> OpenCV , Morphology 를 접하고 공부\n-> 격자 추출의 경우 Opening 연산을 \"적당한\" kernel을 세팅하여 수행하면 글자는 사라지고 격자 구조만 남게되는 것을 확인함.\n-> PaddleOCR로 글자를 detect 하고, layout은 OpenCV의 Opening연산으로 추출하여 같은 Cell에 있는 bbox를 concat 하여 테두리가 있는 Excel 문서에 효과적으로 대응할 수 있게 만듬.",

const STORAGE_KEY = 'fpp-final.notes.v1';
const PANEL_STATE_KEY = 'fpp-final.panel.open';
const TAB_STATE_KEY = 'fpp-final.activeTab';

function loadAll() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch { return {}; }
}
function saveAll(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function key(diagram, nodeId) { return `${diagram}/${nodeId}`; }
function getNote(diagram, nodeId) {
  const all = loadAll();
  return all[key(diagram, nodeId)] || { memo:'', updatedAt:null };
}
function setNote(diagram, nodeId, partial) {
  const all = loadAll();
  const k = key(diagram, nodeId);
  const cur = all[k] || { memo:'', updatedAt:null };
  Object.assign(cur, partial, { updatedAt: new Date().toISOString() });
  if (!cur.memo) delete all[k];
  else all[k] = cur;
  saveAll(all);
}
function hasAny(rec) { return rec && rec.memo; }

const $ = id => document.getElementById(id);
const SVG_NS = 'http://www.w3.org/2000/svg';
let activeDiagram = 'builder';
let selectedNodeId = null;
let saveTimer = null;

function buildHitsFor(diagram) {
  const hitsGroup = $(`hits-${diagram}`);
  hitsGroup.innerHTML = '';
  NODES[diagram].forEach(n => {
    const rect = document.createElementNS(SVG_NS, 'rect');
    rect.setAttribute('class', 'node-hit');
    rect.setAttribute('data-id', n.id);
    rect.setAttribute('data-diagram', diagram);
    rect.setAttribute('x', n.x); rect.setAttribute('y', n.y);
    rect.setAttribute('width', n.w); rect.setAttribute('height', n.h);
    rect.setAttribute('rx', 4); rect.setAttribute('ry', 4);
    rect.addEventListener('click', () => selectNode(diagram, n.id));
    hitsGroup.appendChild(rect);
  });
}

function refreshDots() {
  const all = loadAll();
  ['builder', 'runner'].forEach(d => {
    const hitsGroup = $(`hits-${d}`);
    hitsGroup.querySelectorAll('.note-dot').forEach(n => n.remove());
    hitsGroup.querySelectorAll('.node-hit').forEach(r => r.classList.remove('has-notes'));
    NODES[d].forEach(n => {
      if (hasAny(all[key(d, n.id)])) {
        const hit = hitsGroup.querySelector(`.node-hit[data-id="${n.id}"]`);
        if (hit) hit.classList.add('has-notes');
        const dot = document.createElementNS(SVG_NS, 'circle');
        dot.setAttribute('class', 'note-dot');
        dot.setAttribute('cx', n.x + n.w - 5);
        dot.setAttribute('cy', n.y + 5);
        dot.setAttribute('r', 4);
        hitsGroup.appendChild(dot);
      }
    });
  });
  refreshTabBadges();
  refreshNotedList();
}

function refreshTabBadges() {
  const all = loadAll();
  ['builder', 'runner'].forEach(d => {
    const n = NODES[d].filter(node => hasAny(all[key(d, node.id)])).length;
    const badge = $(`cnt-${d}`);
    badge.textContent = n;
    badge.hidden = n === 0;
  });
}

function selectNode(diagram, nodeId) {
  if (diagram !== activeDiagram) switchDiagram(diagram);
  selectedNodeId = nodeId;
  document.querySelectorAll('.node-hit').forEach(r => {
    const same = r.getAttribute('data-id') === nodeId &&
                 r.getAttribute('data-diagram') === diagram;
    r.classList.toggle('selected', same);
  });
  const node = NODES[diagram].find(n => n.id === nodeId);
  if (!node) return;
  setPanelOpen(true);
  $('panelEmpty').hidden = true;
  $('panelContent').hidden = false;
  $('nodeName').textContent = node.name;
  $('nodeId').textContent = `${node.cat} · ${nodeId}`;
  const tag = $('diagramTag');
  tag.textContent = diagram;
  tag.className = `diagram-tag ${diagram}`;
  const rec = getNote(diagram, nodeId);
  $('taMemo').value = rec.memo;
  updateCounts();
  setSaveState(rec.updatedAt ? `마지막 저장: ${formatTime(rec.updatedAt)}` : '아직 저장된 메모 없음');
}

function clearSelection() {
  selectedNodeId = null;
  document.querySelectorAll('.node-hit').forEach(r => r.classList.remove('selected'));
  $('panelEmpty').hidden = false;
  $('panelContent').hidden = true;
}

function updateCounts() {
  const m = $('taMemo').value;
  $('cntMemo').textContent = m ? `${countLines(m)}줄` : '';
  updateLinks(m);
}

function updateLinks(memo) {
  const box = $('memoLinks');
  // http(s)://, file:///, www. 시작 URL 추출. 끝에 따라붙는 일반적 구두점 제거.
  const re = /(https?:\/\/[^\s<>"'`]+|file:\/\/\/[^\s<>"'`]+|www\.[^\s<>"'`]+)/gi;
  const found = (memo.match(re) || []).map(u => u.replace(/[.,;:)\]}]+$/, ''));
  const uniq = [...new Set(found)];
  if (uniq.length === 0) {
    box.classList.add('empty');
    box.innerHTML = '';
    return;
  }
  box.classList.remove('empty');
  box.innerHTML = `<div class="label">링크 (${uniq.length})</div>` +
    uniq.map(u => {
      const href = u.startsWith('www.') ? 'http://' + u : u;
      // 텍스트 escape
      const safe = u.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return `<a href="${href}" target="_blank" rel="noopener">${safe}</a>`;
    }).join('');
}
function countLines(s) { return s.split(/\n/).filter(x => x.trim()).length; }
function formatTime(iso) {
  try {
    const d = new Date(iso); const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  } catch { return iso; }
}
function setSaveState(text) { $('saveState').textContent = text; }

function debounceSave() {
  if (!selectedNodeId) return;
  setSaveState('저장 중…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    setNote(activeDiagram, selectedNodeId, {
      memo: $('taMemo').value,
    });
    setSaveState(`마지막 저장: ${formatTime(new Date().toISOString())}`);
    refreshDots();
    updateCounts();
  }, 350);
}

$('taMemo').addEventListener('input', debounceSave);
$('closeBtn').addEventListener('click', () => { clearSelection(); setPanelOpen(false); });

function refreshNotedList() {
  const all = loadAll();
  const ul = $('notedList');
  ul.innerHTML = '';
  const items = [];
  Object.keys(all).forEach(k => {
    const [diagram, nodeId] = k.split('/');
    const node = (NODES[diagram] || []).find(n => n.id === nodeId);
    if (node && hasAny(all[k])) items.push({ diagram, nodeId, node, rec: all[k] });
  });
  items.sort((a, b) => (b.rec.updatedAt || '').localeCompare(a.rec.updatedAt || ''));
  $('filterLabel').textContent = `(전체 ${items.length}건)`;
  items.forEach(it => {
    const li = document.createElement('li');
    const left = document.createElement('span');
    const diag = document.createElement('span');
    diag.className = `diag ${it.diagram}`;
    diag.textContent = it.diagram === 'builder' ? 'B' : 'R';
    left.appendChild(diag);
    left.append(document.createTextNode(it.node.name));
    const right = document.createElement('span');
    right.className = 'tag';
    right.textContent = it.rec.memo ? `${countLines(it.rec.memo)}줄` : '';
    li.appendChild(left); li.appendChild(right);
    li.addEventListener('click', () => selectNode(it.diagram, it.nodeId));
    ul.appendChild(li);
  });
}

function switchDiagram(name) {
  activeDiagram = name;
  document.querySelectorAll('.diagram-canvas').forEach(c => {
    c.hidden = c.dataset.diagram !== name;
  });
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.diagram === name);
  });
  localStorage.setItem(TAB_STATE_KEY, name);
  clearSelection();
}
document.querySelectorAll('.tab-btn').forEach(b => {
  b.addEventListener('click', () => switchDiagram(b.dataset.diagram));
});

function setPanelOpen(open) {
  const main = document.querySelector('main');
  main.classList.toggle('panel-collapsed', !open);
  $('togglePanelBtn').textContent = open ? '패널 ▶' : '패널 ◀';
  localStorage.setItem(PANEL_STATE_KEY, open ? '1' : '0');
}
$('togglePanelBtn').addEventListener('click', () => {
  const isCollapsed = document.querySelector('main').classList.contains('panel-collapsed');
  setPanelOpen(isCollapsed);
});
$('reopenHandle').addEventListener('click', () => setPanelOpen(true));

$('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(loadAll(), null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  a.href = url; a.download = `fpp-final-notes-${ts}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
});
$('importBtn').addEventListener('click', () => $('importFile').click());
$('importFile').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      const cur = loadAll();
      Object.assign(cur, data);
      saveAll(cur);
      refreshDots();
      if (selectedNodeId) selectNode(activeDiagram, selectedNodeId);
      alert(`불러왔어. ${Object.keys(data).length}개 항목 병합 완료.`);
    } catch (err) { alert('파일 형식 오류: ' + err.message); }
  };
  reader.readAsText(file);
  e.target.value = '';
});
$('clearBtn').addEventListener('click', () => {
  if (!selectedNodeId) { alert('먼저 노드를 선택해.'); return; }
  const node = NODES[activeDiagram].find(n => n.id === selectedNodeId);
  if (!confirm(`'${node.name}' (${activeDiagram}) 노트 삭제할까?`)) return;
  const all = loadAll();
  delete all[key(activeDiagram, selectedNodeId)];
  saveAll(all);
  selectNode(activeDiagram, selectedNodeId);
  refreshDots();
});

function loadEmbedded() {
  const el = document.getElementById('embedded-notes');
  if (!el) return {};
  try { return JSON.parse((el.textContent || '').trim() || '{}'); }
  catch { return {}; }
}

function mergeEmbeddedIntoLocal() {
  const embedded = loadEmbedded();
  if (!embedded || Object.keys(embedded).length === 0) return 0;
  const local = loadAll();
  let added = 0;
  for (const k in embedded) {
    const e = embedded[k];
    const l = local[k];
    if (!l) {
      local[k] = e;
      added++;
    } else {
      // 양쪽 다 있으면 updatedAt 새로운 쪽 우선
      const lu = l.updatedAt || '';
      const eu = e.updatedAt || '';
      if (eu > lu) { local[k] = e; added++; }
    }
  }
  saveAll(local);
  return added;
}

$('downloadHtmlBtn').addEventListener('click', () => {
  const notes = loadAll();
  const notesJson = JSON.stringify(notes, null, 2)
    .replace(/<\//g, '<\\/');   // </script> 침해 방지
  const html = document.documentElement.outerHTML.replace(
    /<script type="application\/json" id="embedded-notes">[\s\S]*?<\/script>/,
    () => `<script type="application/json" id="embedded-notes">${notesJson}<\/script>`
  );
  const blob = new Blob(['<!DOCTYPE html>\n', html],
                        { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  a.href = url; a.download = `fpp-viewer-${ts}.html`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
});

const mergedCount = mergeEmbeddedIntoLocal();
if (mergedCount > 0) console.log(`내장 노트 ${mergedCount}개 병합`);

buildHitsFor('builder');
buildHitsFor('runner');

const savedTab = localStorage.getItem(TAB_STATE_KEY);
if (savedTab === 'runner' || savedTab === 'builder') switchDiagram(savedTab);
else switchDiagram('builder');

const savedPanel = localStorage.getItem(PANEL_STATE_KEY);
setPanelOpen(savedPanel === null ? true : savedPanel === '1');

refreshDots();
</script>
